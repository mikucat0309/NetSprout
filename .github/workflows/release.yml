name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: cargo build --release --locked

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create
          --title="${{ github.ref_name }}"
          --generate-notes
          "${{ github.ref_name }}"
          "target/release/netsprout"
